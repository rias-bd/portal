<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a4d2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RIAS Member Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#1a4d2e;--gd:#0f2d19;--gold:#c9a84c;--cream:#f5f5f0;--lg:#e8f0eb;--lgold:#fdf8ee;--red:#b3261e;--ok:#1b7a3d;--tx:#1d2b22;--mut:#6b776f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--cream);color:var(--tx);min-height:100vh}
.hide{display:none!important}
header{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}
header img{width:40px;height:40px;background:#fff;border-radius:10px;padding:2px}
header h1{font-size:16px;margin:0;line-height:1.2}header small{opacity:.8;font-size:11px}
header .sp{flex:1}
.btn{border:0;border-radius:12px;padding:12px 16px;font:600 15px inherit;font-family:inherit;background:var(--g);color:#fff;cursor:pointer}
.btn.gold{background:var(--gold);color:var(--gd)}.btn.out{background:transparent;border:1.5px solid var(--g);color:var(--g)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}.btn.ghost{background:rgba(255,255,255,.15);color:#fff}
.btn.red{background:var(--red)}.btn:disabled{opacity:.6}
main{max-width:640px;margin:0 auto;padding:16px 16px 90px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 6px rgba(15,45,25,.08)}
.card h2{margin:0 0 10px;font-size:15px;color:var(--g)}
.hero{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border-radius:18px;padding:20px;margin-bottom:14px;border-bottom:4px solid var(--gold)}
.hero .l{font-size:13px;opacity:.85}.hero .v{font-size:34px;font-weight:700}
.hero.neg{background:linear-gradient(135deg,#8a2a24,#5b1511)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--lg);border-radius:12px;padding:12px}.stat.gold{background:var(--lgold);border:1px solid #eadcae}
.stat .l{font-size:12px;color:var(--mut)}.stat .v{font-size:20px;font-weight:700;color:var(--g)}
.stat.gold .v{color:#7a5d10}.stat .v.neg{color:var(--red)}
.bar{height:12px;background:#e4e8e5;border-radius:99px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:var(--g);color:#fff;text-align:left;padding:8px;font-weight:600}th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
td{padding:9px 8px;border-bottom:1px solid #edf0ee}td.r,th.r{text-align:right}tr.tot td{font-weight:700;background:var(--lgold)}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1.5px solid #cfd8d2;border-radius:10px;font:16px inherit;font-family:inherit;background:#fff}
input:focus,select:focus{outline:0;border-color:var(--g)}
.auth{max-width:420px;margin:0 auto;padding:30px 20px}
.auth .logo{text-align:center;margin-bottom:18px}.auth .logo img{width:96px}.auth .logo h1{color:var(--g);margin:8px 0 2px;font-size:20px}.auth .logo p{margin:0;color:var(--gold);font-size:12px;font-weight:600}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;margin-top:12px}.msg.e{background:#fdeceb;color:var(--red)}.msg.o{background:var(--lg);color:var(--g)}
.link{color:var(--g);font-weight:600;cursor:pointer;text-align:center;display:block;margin-top:14px;font-size:14px;text-decoration:underline}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--lg);color:var(--g);font-weight:600}.badge.w{background:#fff1d6;color:#8a5a00}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.mrow{padding:12px 0;border-bottom:1px solid #edf0ee;cursor:pointer}.mrow:last-child{border:0}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:#e4ebe6;font:600 14px inherit;font-family:inherit;color:var(--g)}.tabs button.on{background:var(--g);color:#fff}
.pos{color:var(--ok)}.neg{color:var(--red)}
.empty{color:var(--mut);text-align:center;padding:14px;font-size:14px}
.foot{text-align:center;color:var(--mut);font-size:11px;margin-top:20px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="auth hide">
  <div class="logo"><img src="logo.png" alt="RIAS"><h1>রাবিতা ইত্তিহাদ আশ-শুব্বান</h1><p>ঐক্য • দায়িত্বশীলতা • ইসলামি মূল্যবোধ</p></div>
  <div class="card">
    <h2 id="authTitle">সদস্য লগইন</h2>
    <div id="nameWrap" class="hide"><label>পূর্ণ নাম</label><input id="name" autocomplete="name"></div>
    <label>ইমেইল</label><input id="email" type="email" autocomplete="email" inputmode="email">
    <div id="passWrap"><label>পাসওয়ার্ড</label><input id="pass" type="password" autocomplete="current-password"></div>
    <button class="btn" style="width:100%;margin-top:16px" id="authBtn">লগইন</button>
    <div id="authMsg"></div>
    <span class="link" id="toSignup">নতুন সদস্য? অ্যাকাউন্ট খুলুন</span>
    <span class="link" id="toForgot">পাসওয়ার্ড ভুলে গেছেন?</span>
    <span class="link hide" id="toLogin">← লগইনে ফিরে যান</span>
  </div>
</div>

<!-- RESET PASSWORD (from email link) -->
<div id="reset" class="auth hide">
  <div class="card"><h2>নতুন পাসওয়ার্ড সেট করুন</h2>
    <label>নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="np" type="password" autocomplete="new-password">
    <button class="btn" style="width:100%;margin-top:16px" id="npBtn">সংরক্ষণ করুন</button><div id="npMsg"></div></div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <header><img src="logo.png" alt=""><div><h1>RIAS Member Portal</h1><small id="who"></small></div><div class="sp"></div>
    <button class="btn sm ghost" id="pwBtn">🔑</button><button class="btn sm ghost" id="outBtn">বের হই</button></header>
  <main id="main"></main>
</div>

<script>
const SB_URL='https://ofzjgvkfhhrikqshqqkt.supabase.co';
const SB_KEY='sb_publishable_XzXm84AzYTliIGSEpM7vqg_MGO4pUL-';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=n=>'৳'+Number(n||0).toLocaleString('bn-BD');
const MONTHS=['','জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const PH={1:'পর্যায় ১ (জানু–জুন ২০২৫)',2:'পর্যায় ২ (জুলাই–ডিসেম্বর ২০২৫)',3:'পর্যায় ৩ (জানু–জুন ২০২৬)',4:'পর্যায় ৪ (জুলাই–ডিসেম্বর ২০২৬)'};
let me=null,mode='login',isAdmin=false;

function show(id){['auth','reset','app'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function msg(el,t,ok){$(el).innerHTML=t?`<div class="msg ${ok?'o':'e'}">${esc(t)}</div>`:''}
function errBn(e){const m=(e&&e.message)||'';
  if(/Invalid login/i.test(m))return'ইমেইল বা পাসওয়ার্ড ভুল।';
  if(/not confirmed/i.test(m))return'ইমেইল এখনো কনফার্ম হয়নি। ইনবক্স চেক করুন।';
  if(/already registered/i.test(m))return'এই ইমেইলে অ্যাকাউন্ট আগেই আছে। লগইন করুন।';
  if(/rate limit/i.test(m))return'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।';
  return m||'কিছু একটা সমস্যা হয়েছে।'}

function setMode(m){mode=m;
  $('authTitle').textContent={login:'সদস্য লগইন',signup:'নতুন অ্যাকাউন্ট',forgot:'পাসওয়ার্ড রিসেট'}[m];
  $('authBtn').textContent={login:'লগইন',signup:'অ্যাকাউন্ট খুলুন',forgot:'রিসেট লিংক পাঠান'}[m];
  $('nameWrap').classList.toggle('hide',m!=='signup');$('passWrap').classList.toggle('hide',m==='forgot');
  $('toSignup').classList.toggle('hide',m!=='login');$('toForgot').classList.toggle('hide',m!=='login');$('toLogin').classList.toggle('hide',m==='login');
  $('pass').autocomplete=m==='signup'?'new-password':'current-password';msg('authMsg','')}
$('toSignup').onclick=()=>setMode('signup');$('toForgot').onclick=()=>setMode('forgot');$('toLogin').onclick=()=>setMode('login');

$('authBtn').onclick=async()=>{
  const email=$('email').value.trim(),pass=$('pass').value,name=$('name').value.trim();
  if(!email){return msg('authMsg','ইমেইল দিন')}
  $('authBtn').disabled=true;msg('authMsg','');
  try{
    if(mode==='login'){
      if(!pass)throw{message:'পাসওয়ার্ড দিন'};
      const{error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;
    }else if(mode==='signup'){
      if(!name)throw{message:'নাম দিন'};if(pass.length<6)throw{message:'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে'};
      const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});if(error)throw error;
      if(data.session){await sb.auth.signOut();}
      msg('authMsg','অ্যাকাউন্ট তৈরি হয়েছে। ইমেইল কনফার্মেশন লাগলে ইনবক্স দেখুন। MD অনুমোদন দিলে আপনার তথ্য দেখতে পাবেন।',true);setMode('login');msg('authMsg','অ্যাকাউন্ট তৈরি হয়েছে। MD অনুমোদন দিলে আপনার তথ্য দেখতে পাবেন (ইমেইল কনফার্মেশন চাইলে আগে সেটি করুন)।',true);
    }else{
      const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
      msg('authMsg','রিসেট লিংক ইমেইলে পাঠানো হয়েছে। স্প্যাম ফোল্ডারও দেখুন।',true);
    }
  }catch(e){msg('authMsg',errBn(e))}
  $('authBtn').disabled=false};
['email','pass','name'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')$('authBtn').click()}));

$('outBtn').onclick=async()=>{await sb.auth.signOut()};
$('pwBtn').onclick=()=>{show('reset')};
$('npBtn').onclick=async()=>{
  const p=$('np').value;if(p.length<6)return msg('npMsg','কমপক্ষে ৬ অক্ষর দিন');
  const{error}=await sb.auth.updateUser({password:p});
  if(error)return msg('npMsg',errBn(error));
  msg('npMsg','পাসওয়ার্ড বদলানো হয়েছে ✅',true);$('np').value='';history.replaceState(null,'',location.pathname);setTimeout(()=>boot(),900)};

sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY'){show('reset');return}
  if(ev==='SIGNED_OUT'){me=null;show('auth');setMode('login');return}
  if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'){if(session)setTimeout(boot,0);else show('auth')}
});

async function boot(){
  const{data:{user}}=await sb.auth.getUser();if(!user){show('auth');return}
  const{data:m,error}=await sb.from('members').select('*').eq('id',user.id).maybeSingle();
  show('app');
  if(error){$('main').innerHTML=`<div class="card"><div class="msg e">ডেটা আনতে সমস্যা: ${esc(error.message)}</div></div>`;return}
  if(!m){$('who').textContent=user.email;$('main').innerHTML=`<div class="card"><h2>প্রোফাইল পাওয়া যায়নি</h2><p>আপনার ইমেইল (${esc(user.email)}) সদস্য তালিকায় নেই। MD-এর সাথে যোগাযোগ করুন।</p></div>`;return}
  me=m;isAdmin=m.role==='admin'&&m.is_approved;$('who').textContent=m.name;
  if(!m.is_approved){$('main').innerHTML=`<div class="card"><h2>⏳ অনুমোদনের অপেক্ষায়</h2><p>আপনার অ্যাকাউন্ট এখনো MD অনুমোদন করেননি। অনুমোদন হলে এখানে আপনার তথ্য দেখা যাবে।</p></div>`;return}
  isAdmin?renderAdmin():renderMember(m.id,false)
}

async function loadFor(id){
  const[c,l]=await Promise.all([
    sb.from('contributions').select('*').eq('member_id',id).order('phase').order('year').order('month'),
    sb.from('loans').select('*').eq('member_id',id).maybeSingle()]);
  return{c:c.data||[],l:l.data||{total_disbursed:0,total_repaid:0,outstanding:0},err:c.error||l.error}}

function memberHtml(name,c,l){
  const paid=c.filter(x=>x.is_paid!==false),tot=paid.reduce((s,x)=>s+Number(x.amount),0);
  const out=Number(l.outstanding||0),dis=Number(l.total_disbursed||0),rep=Number(l.total_repaid||0);
  const net=tot-out,pct=dis?Math.round(rep/dis*100):0;
  const byPh={};paid.forEach(x=>byPh[x.phase]=(byPh[x.phase]||0)+Number(x.amount));
  const rows=c.map(x=>`<tr><td>${esc(PH[x.phase]||'পর্যায় '+x.phase)}${x.month?`<br><small style="color:var(--mut)">${MONTHS[x.month]||''} ${x.year||''}</small>`:''}</td><td class="r">${bn(x.amount)}</td><td class="r">${x.is_paid===false?'<span class="badge w">বাকি</span>':'<span class="badge">জমা</span>'}</td></tr>`).join('');
  return`
  <div class="hero ${net<0?'neg':''}"><div class="l">${esc(name)} — নিট আর্থিক অবস্থান</div><div class="v">${net<0?'−':''}${bn(Math.abs(net))}</div><div class="l">মোট জমা − বকেয়া কর্জে হাসানা</div></div>
  <div class="card"><h2>💰 আমার জমা</h2><div class="stat"><div class="l">মোট জমা</div><div class="v">${bn(tot)}</div></div>
    ${rows?`<table style="margin-top:10px"><tr><th>বিবরণ</th><th class="r">পরিমাণ</th><th class="r">অবস্থা</th></tr>${rows}<tr class="tot"><td>মোট</td><td class="r">${bn(tot)}</td><td></td></tr></table>`:'<div class="empty">কোনো জমার তথ্য নেই</div>'}</div>
  <div class="card"><h2>🤝 কর্জে হাসানা</h2>
    <div class="grid"><div class="stat gold"><div class="l">মোট গ্রহণ</div><div class="v">${bn(dis)}</div></div><div class="stat"><div class="l">পরিশোধিত</div><div class="v">${bn(rep)}</div></div></div>
    <div class="stat gold" style="margin-top:10px"><div class="l">বকেয়া</div><div class="v ${out>0?'neg':''}">${bn(out)}</div></div>
    ${dis?`<div class="bar"><i style="width:${pct}%"></i></div><small style="color:var(--mut)">${pct}% পরিশোধ সম্পন্ন</small>`:'<div class="empty">কোনো কর্জ নেই</div>'}</div>
  <div class="foot">তথ্য শুধু আপনি ও MD দেখতে পারেন • RIAS</div>`}

async function renderMember(id,back){
  $('main').innerHTML='<div class="empty">লোড হচ্ছে…</div>';
  const{c,l,err}=await loadFor(id);
  const name=back?back.name:me.name;
  $('main').innerHTML=(back?`<button class="btn sm out" onclick="renderAdmin()" style="margin-bottom:12px">← সব সদস্য</button>`:'')+(err?`<div class="msg e">${esc(err.message)}</div>`:'')+memberHtml(name,c,l)+(back?adminEdit(back,c,l):'')}

/* ADMIN */
let allM=[],allC=[],allL=[];
async function renderAdmin(tab='sum'){
  $('main').innerHTML='<div class="empty">লোড হচ্ছে…</div>';
  const[m,c,l]=await Promise.all([sb.from('members').select('*').order('created_at'),sb.from('contributions').select('*'),sb.from('loans').select('*')]);
  allM=m.data||[];allC=c.data||[];allL=l.data||[];
  const pend=allM.filter(x=>!x.is_approved);
  const sumC=id=>allC.filter(x=>x.member_id===id&&x.is_paid!==false).reduce((s,x)=>s+Number(x.amount),0);
  const L=id=>allL.find(x=>x.member_id===id)||{};
  const ap=allM.filter(x=>x.is_approved);
  const T={c:0,d:0,r:0,o:0};ap.forEach(x=>{T.c+=sumC(x.id);T.d+=Number(L(x.id).total_disbursed||0);T.r+=Number(L(x.id).total_repaid||0);T.o+=Number(L(x.id).outstanding||0)});
  $('main').innerHTML=`
  <div class="hero"><div class="l">সংগঠনের মোট নিট অবদান</div><div class="v">${bn(T.c)}</div><div class="l">মোট কর্জ বকেয়া: ${bn(T.o)} • সদস্য: ${ap.length} জন</div></div>
  ${pend.length?`<div class="card"><h2>⏳ অনুমোদনের অপেক্ষায় (${pend.length})</h2>${pend.map(x=>`<div class="row mrow" style="cursor:default"><div><b>${esc(x.name)}</b><br><small>${esc(x.email)}</small></div><div><button class="btn sm" onclick="approve('${x.id}')">অনুমোদন</button></div></div>`).join('')}</div>`:''}
  <div class="card"><h2>👥 সকল সদস্য</h2>${ap.map(x=>{const net=sumC(x.id)-Number(L(x.id).outstanding||0);return`<div class="mrow" onclick="openMember('${x.id}')"><div class="row"><b>${esc(x.name)} ${x.role==='admin'?'<span class="badge">MD</span>':''}</b><span class="${net<0?'neg':'pos'}"><b>${net<0?'−':''}${bn(Math.abs(net))}</b></span></div><small style="color:var(--mut)">জমা ${bn(sumC(x.id))} • কর্জ বকেয়া ${bn(L(x.id).outstanding||0)}</small></div>`}).join('')||'<div class="empty">কেউ নেই</div>'}</div>
  <div class="card"><h2>➕ নতুন সদস্য যোগ করবেন কীভাবে?</h2><small style="color:var(--mut)">সদস্য নিজে "অ্যাকাউন্ট খুলুন" থেকে সাইন-আপ করলে এখানে "অনুমোদনের অপেক্ষায়" দেখাবে। তারপর অনুমোদন দিন।</small></div>`}

async function approve(id){const{error}=await sb.from('members').update({is_approved:true}).eq('id',id);if(error)return alert(error.message);renderAdmin()}
function openMember(id){const m=allM.find(x=>x.id===id);renderMember(id,m)}

function adminEdit(m,c,l){
  return`<div class="card"><h2>🛠️ MD: জমা যোগ করুন</h2>
   <label>পর্যায়</label><select id="aPh">${[1,2,3,4].map(p=>`<option value="${p}" ${p===4?'selected':''}>${PH[p]}</option>`).join('')}</select>
   <div class="grid"><div><label>মাস</label><select id="aMo"><option value="">—</option>${MONTHS.map((x,i)=>i?`<option value="${i}">${x}</option>`:'').join('')}</select></div><div><label>বছর</label><input id="aYr" type="number" value="2026"></div></div>
   <label>পরিমাণ (৳)</label><input id="aAm" type="number" inputmode="numeric">
   <button class="btn" style="width:100%;margin-top:12px" onclick="addC('${m.id}')">জমা সংরক্ষণ</button>
   ${c.length?`<label style="margin-top:16px">ভুল এন্ট্রি মুছুন</label>${c.map(x=>`<div class="row" style="padding:6px 0;font-size:13px"><span>${esc(PH[x.phase]||x.phase)} ${x.month?MONTHS[x.month]:''} — ${bn(x.amount)}</span><span><button class="btn sm out" onclick="tog('${x.id}',${x.is_paid===false},'${m.id}')">${x.is_paid===false?'জমা করুন':'বাকি করুন'}</button> <button class="btn sm red" onclick="delC('${x.id}','${m.id}')">✕</button></span></div>`).join('')}`:''}
  </div>
  <div class="card"><h2>🛠️ MD: কর্জে হাসানা আপডেট</h2>
   <div class="grid"><div><label>মোট গ্রহণ</label><input id="lD" type="number" value="${l.total_disbursed||0}"></div><div><label>মোট পরিশোধ</label><input id="lR" type="number" value="${l.total_repaid||0}"></div></div>
   <small style="color:var(--mut)">বকেয়া নিজে হিসাব হবে (গ্রহণ − পরিশোধ)</small>
   <button class="btn gold" style="width:100%;margin-top:12px" onclick="saveL('${m.id}')">আপডেট করুন</button></div>`}

async function addC(id){
  const amount=Number($('aAm').value);if(!amount)return alert('পরিমাণ দিন');
  const row={member_id:id,phase:Number($('aPh').value),month:$('aMo').value?Number($('aMo').value):null,year:Number($('aYr').value)||null,amount,is_paid:true};
  const{error}=await sb.from('contributions').insert(row);if(error)return alert(error.message);openMember(id)}
async function tog(cid,paid,id){const{error}=await sb.from('contributions').update({is_paid:paid}).eq('id',cid);if(error)return alert(error.message);openMember(id)}
async function delC(cid,id){if(!confirm('এই এন্ট্রি মুছবেন?'))return;const{error}=await sb.from('contributions').delete().eq('id',cid);if(error)return alert(error.message);openMember(id)}
async function saveL(id){
  const d=Number($('lD').value)||0,r=Number($('lR').value)||0;
  const{error}=await sb.from('loans').upsert({member_id:id,total_disbursed:d,total_repaid:r,outstanding:d-r,updated_at:new Date().toISOString()},{onConflict:'member_id'});
  if(error)return alert(error.message+'\n(loans table-এ member_id unique না থাকলে SQL-এ unique constraint যোগ করুন)');openMember(id)}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
setMode('login');
</script>
</body>
</html>
